  <body>
    <div id="root"></div>

    <!--
      Formulário "fantasma" para a Netlify detectar o formulário de contato no build.
      Os campos precisam ser os mesmos de src/sections/Contact.tsx.
    -->
    <form name="contato" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <textarea name="mensagem"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
